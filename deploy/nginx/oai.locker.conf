server {
    listen 127.0.0.1:18080;
    server_name _;

    root /var/www/oai.locker/candidate;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name oai.locker;

    root /var/www/oai.locker/current;
    index index.html;

    charset utf-8;
    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|jpg|jpeg|png|webp|avif|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.mp4$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oai.locker/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oai.locker/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name oai.locker;

    return 301 https://$host$request_uri;
}
